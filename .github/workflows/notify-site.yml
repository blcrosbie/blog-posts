name: Notify Site of Blog Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch event to site repo
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.REPOSITORY_DISPATCH }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HalogenSolutions/Blog/dispatches \
            -d '{"event_type":"update_blog","client_payload":{"source":"${{ github.repository }}","sha":"${{ github.sha }}"}}'